name: Model catalog bump

# The model catalog is compiled into the pinned @earendil-works/pi-* packages.
# A weekly bump keeps new models (and dropped/renamed ones) flowing in as a
# reviewable PR instead of a manual dependency chore.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: model-catalog-bump
  cancel-in-progress: false

jobs:
  bump:
    name: Bump pi packages and open PR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Record current catalog version
        id: before
        run: |
          echo "version=$(node -p "require('./packages/adapters/package.json').dependencies['@earendil-works/pi-ai']")" >> "$GITHUB_OUTPUT"
      - name: Update pi packages to latest
        run: |
          pnpm --filter @rakazo/adapters update "@earendil-works/pi-ai" "@earendil-works/pi-agent-core" --latest
          pnpm install
      - name: Check for changes
        id: changed
        run: |
          if git diff --quiet packages/adapters/package.json pnpm-lock.yaml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "version=$(node -p "require('./packages/adapters/package.json').dependencies['@earendil-works/pi-ai']")" >> "$GITHUB_OUTPUT"
          fi
      - name: Typecheck and test adapters
        if: steps.changed.outputs.changed == 'true'
        run: |
          pnpm --filter @rakazo/adapters check
          pnpm --filter @rakazo/adapters test
      - name: Open bump PR
        if: steps.changed.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          OLD_VERSION: ${{ steps.before.outputs.version }}
          NEW_VERSION: ${{ steps.changed.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="deps/pi-catalog-${NEW_VERSION}"
          git checkout -b "$branch"
          git add packages/adapters/package.json pnpm-lock.yaml
          git commit -m "Bump model catalog packages to ${NEW_VERSION}"
          if gh pr view "$branch" --json number >/dev/null 2>&1; then
            echo "PR already open for $branch; leaving it in place."
            exit 0
          fi
          git push -u origin "$branch"
          for pr in $(gh pr list --state open --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("deps/pi-catalog-")) | .number'); do
            gh pr close "$pr" --comment "Superseded by the ${NEW_VERSION} catalog bump." || true
          done
          gh pr create --title "Bump model catalog to ${NEW_VERSION}" --body "$(cat <<EOF
          ## Why

          The model catalog is compiled into the pinned \`@earendil-works/pi-ai\` /
          \`pi-agent-core\` packages, so provider models only appear after a bump.
          This automated PR moves the pin from ${OLD_VERSION} to ${NEW_VERSION}.

          ## Tested

          \`pnpm --filter @rakazo/adapters check\` and \`pnpm --filter @rakazo/adapters test\`
          pass in the bump job. Review the pi release notes for renamed or removed
          models before merging.

          Note: this PR is opened by GITHUB_TOKEN, so its checks do not start on
          their own. Close and reopen the PR (or push a commit) to trigger CI.
          EOF
          )"
